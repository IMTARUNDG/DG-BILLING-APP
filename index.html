<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG BILLING APP</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2pdf for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Identity Services (For Google Drive Sync) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
            .print\:hidden { display: none !important; }
            .break-page { page-break-before: always; }
            @page { size: A4; margin: 0; }
        }
        .break-page { page-break-before: always; }
    </style>
</head>
<body class="bg-slate-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STATES = [
            { code: '01', name: 'Jammu & Kashmir' }, { code: '02', name: 'Himachal Pradesh' }, { code: '03', name: 'Punjab' },
            { code: '04', name: 'Chandigarh' }, { code: '05', name: 'Uttarakhand' }, { code: '06', name: 'Haryana' },
            { code: '07', name: 'Delhi' }, { code: '08', name: 'Rajasthan' }, { code: '09', name: 'Uttar Pradesh' },
            { code: '10', name: 'Bihar' }, { code: '11', name: 'Sikkim' }, { code: '12', name: 'Arunachal Pradesh' },
            { code: '13', name: 'Nagaland' }, { code: '14', name: 'Manipur' }, { code: '15', name: 'Mizoram' },
            { code: '16', name: 'Tripura' }, { code: '17', name: 'Meghalaya' }, { code: '18', name: 'Assam' },
            { code: '19', name: 'West Bengal' }, { code: '20', name: 'Jharkhand' }, { code: '21', name: 'Odisha' },
            { code: '22', name: 'Chhattisgarh' }, { code: '23', name: 'Madhya Pradesh' }, { code: '24', name: 'Gujarat' },
            { code: '27', name: 'Maharashtra' }, { code: '29', name: 'Karnataka' }, { code: '32', name: 'Kerala' },
            { code: '33', name: 'Tamil Nadu' }, { code: '36', name: 'Telangana' }, { code: '37', name: 'Andhra Pradesh' }
        ];

        const formatInvoiceDate = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            const day = d.getDate();
            const month = d.toLocaleString('en-US', { month: 'long' });
            const year = d.getFullYear();
            return `${day}, ${month} ${year}`;
        };

        const amountToWords = (amount) => {
            if (!amount || amount === 0) return 'Zero';
            const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
            const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const numToWords = (n) => {
                if (n < 20) return a[n];
                let str = b[Math.floor(n / 10)];
                if (n % 10 > 0) str += ' ' + a[n % 10];
                return str;
            };
            const integerPart = Math.floor(amount);
            const decimalPart = Math.round((amount - integerPart) * 100);
            let words = '';
            if (integerPart > 9999999) words += numToWords(Math.floor(integerPart / 10000000)) + 'Crore ';
            if (integerPart > 99999) words += numToWords(Math.floor((integerPart % 10000000) / 100000)) + 'Lakh ';
            if (integerPart > 999) words += numToWords(Math.floor((integerPart % 100000) / 1000)) + 'Thousand ';
            if (integerPart > 99) words += numToWords(Math.floor((integerPart % 1000) / 100)) + 'Hundred ';
            if (integerPart % 100 > 0) words += (words !== '' ? 'and ' : '') + numToWords(integerPart % 100);
            let rupeesStr = words.trim() ? words.trim() + ' Rupees' : '';
            let paiseStr = decimalPart > 0 ? ` and ${numToWords(decimalPart).trim()} Paise` : '';
            return (rupeesStr + paiseStr + ' Only').trim();
        };

        const getFinancialYear = (date = new Date()) => {
            const month = date.getMonth();
            const year = date.getFullYear();
            if (month < 3) return `${year - 1}-${year.toString().slice(-2)}`;
            return `${year}-${(year + 1).toString().slice(-2)}`;
        };

        const loadData = (key, defaultVal) => {
            try { const stored = localStorage.getItem(key); return stored ? JSON.parse(stored) : defaultVal; } 
            catch (e) { return defaultVal; }
        };
        const saveData = (key, data) => localStorage.setItem(key, JSON.stringify(data));
        const isChallanDocument = type => type === 'Challan Bill' || type === 'Job Work Challan' || type === 'Delivery Challan';
        const challanTitle = inv => inv.invoiceType === 'Job Work Challan' ? 'JOB WORK CHALLAN' : inv.invoiceType === 'Delivery Challan' ? 'DELIVERY CHALLAN' : (inv.challanKind === 'Delivery Challan' ? 'DELIVERY CHALLAN' : 'CHALLAN BILL');
        const positiveSeq = value => Number.isSafeInteger(Number(value)) && Number(value) >= 1;
        const challanNumber = (prefix, fy, seq) => `${prefix}-${fy}-${String(seq).padStart(4, '0')}`;

        // Exact decimal multiplication for quantities, rates and percentages (no binary
        // floating point accumulation before rounding monetary values to paise).
        const decimalMultiply = (left, right) => {
            const parse = value => {
                const text = String(value ?? 0).trim();
                if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(text)) return null;
                const sign = text.startsWith('-') ? -1n : 1n;
                const digits = text.replace(/^[+-]/, '').split('.');
                const places = (digits[1] || '').length;
                return { number: sign * BigInt((digits[0] || '0') + (digits[1] || '')), places };
            };
            const a = parse(left), b = parse(right);
            if (!a || !b) return 0;
            return Number(a.number * b.number) / (10 ** (a.places + b.places));
        };
        const roundPaise = value => Math.round((Number(value) + Number.EPSILON) * 100) / 100;
        const displayQty = value => value == null ? '' : String(value);


        const Card = ({ children, className = "" }) => <div className={`bg-white rounded-lg shadow-sm border border-gray-200 ${className}`}>{children}</div>;
        const Input = ({ label, type = "text", value, onChange, required = false, className = "", ...props }) => (
            <div className={`flex flex-col space-y-1 ${className}`}>
                {label && <label className="text-sm font-medium text-gray-700">{label} {required && <span className="text-red-500">*</span>}</label>}
                <input type={type} value={value || ''} onChange={onChange} required={required} className="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" {...props} />
            </div>
        );
        const Select = ({ label, value, onChange, options, required = false, className = "", ...props }) => (
            <div className={`flex flex-col space-y-1 ${className}`}>
                {label && <label className="text-sm font-medium text-gray-700">{label} {required && <span className="text-red-500">*</span>}</label>}
                <select value={value || ''} onChange={onChange} required={required} className="px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm" {...props}>
                    <option value="">Select...</option>
                    {options.map((opt, i) => <option key={i} value={opt.value || opt.code || opt}>{opt.label || opt.name || opt}</option>)}
                </select>
            </div>
        );
        const Button = ({ children, onClick, variant = 'primary', type = 'button', iconClass, className = "", disabled=false, ...props }) => {
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700",
                secondary: "bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300",
                danger: "bg-red-600 text-white hover:bg-red-700",
                success: "bg-green-600 text-white hover:bg-green-700"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md transition-colors ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`} {...props}>
                    {iconClass && <i className={`${iconClass} mr-2`}></i>}
                    {children}
                </button>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [notification, setNotification] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            
            const [companies, setCompanies] = useState(() => loadData('gst_company_list', [{ id: 'default', name: 'Main Company' }]));
            const [activeCompanyId, setActiveCompanyId] = useState(() => loadData('gst_active_company', 'default'));
            const [loadedCompanyId, setLoadedCompanyId] = useState(activeCompanyId);
            
            const getPrefix = (id) => id === 'default' ? 'gst' : `gst_${id}`;

            const [settings, setSettings] = useState(() => loadData(`${getPrefix(activeCompanyId)}_settings`, { prefix: 'INV', nextSeq: 1, currentFY: getFinancialYear() }));
            const [invoices, setInvoices] = useState(() => loadData(`${getPrefix(activeCompanyId)}_invoices`, []));
            const [customers, setCustomers] = useState(() => loadData(`${getPrefix(activeCompanyId)}_customers`, []));
            const [products, setProducts] = useState(() => loadData(`${getPrefix(activeCompanyId)}_products`, []));
            const [payments, setPayments] = useState(() => loadData(`${getPrefix(activeCompanyId)}_payments`, [])); 
            
            const [viewInvoice, setViewInvoice] = useState(null);
            const [isCreatingInvoice, setIsCreatingInvoice] = useState(false);
            const [newDocumentType, setNewDocumentType] = useState('Tax Invoice');
            const [editInvoiceData, setEditInvoiceData] = useState(null);

            useEffect(() => {
                const prefix = getPrefix(activeCompanyId);
                setSettings(loadData(`${prefix}_settings`, { prefix: 'INV', nextSeq: 1, currentFY: getFinancialYear() }));
                setInvoices(loadData(`${prefix}_invoices`, []));
                setCustomers(loadData(`${prefix}_customers`, []));
                setProducts(loadData(`${prefix}_products`, []));
                setPayments(loadData(`${prefix}_payments`, []));
                setLoadedCompanyId(activeCompanyId);
                saveData('gst_active_company', activeCompanyId);
            }, [activeCompanyId]);

            useEffect(() => { if (loadedCompanyId === activeCompanyId) saveData(`${getPrefix(activeCompanyId)}_settings`, settings); }, [settings, activeCompanyId, loadedCompanyId]);
            useEffect(() => { if (loadedCompanyId === activeCompanyId) saveData(`${getPrefix(activeCompanyId)}_invoices`, invoices); }, [invoices, activeCompanyId, loadedCompanyId]);
            useEffect(() => { if (loadedCompanyId === activeCompanyId) saveData(`${getPrefix(activeCompanyId)}_customers`, customers); }, [customers, activeCompanyId, loadedCompanyId]);
            useEffect(() => { if (loadedCompanyId === activeCompanyId) saveData(`${getPrefix(activeCompanyId)}_products`, products); }, [products, activeCompanyId, loadedCompanyId]);
            useEffect(() => { if (loadedCompanyId === activeCompanyId) saveData(`${getPrefix(activeCompanyId)}_payments`, payments); }, [payments, activeCompanyId, loadedCompanyId]);
            useEffect(() => saveData('gst_company_list', companies), [companies]);

            const notify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 4500);
            };

            const handleCompanySwitch = (e) => {
                setIsCreatingInvoice(false);
                setViewInvoice(null);
                setEditInvoiceData(null);
                if(e.target.value === 'NEW') {
                    const name = prompt("Enter new company name:");
                    if(name && name.trim() !== '') {
                        const newId = 'comp_' + Date.now();
                        setCompanies([...companies, {id: newId, name}]);
                        setActiveCompanyId(newId);
                        setActiveTab('settings');
                        notify(`Switched to new company: ${name}`);
                    }
                } else {
                    setActiveCompanyId(e.target.value);
                    notify(`Switched Company`);
                }
            };

            const handleDuplicateInvoice = (inv) => {
                const duplicateData = {
                    ...inv,
                    id: null,
                    invoiceNumber: '',
                    invoiceDate: new Date().toISOString().split('T')[0],
                    amountReceived: 0,
                    paymentMode: 'Unpaid',
                    status: 'Generated'
                };
                setEditInvoiceData(duplicateData);
                setViewInvoice(null);
                setIsCreatingInvoice(true);
            };

            const NAV_ITEMS = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fas fa-chart-line' },
                { id: 'invoices', label: 'Invoices', icon: 'fas fa-file-invoice' },
                 { id: 'challans', label: 'Challans', icon: 'fas fa-truck-loading' },
                { id: 'customers', label: 'Parties / Ledger', icon: 'fas fa-users' },
                { id: 'products', label: 'Products', icon: 'fas fa-box' },
                { id: 'reports', label: 'Reports', icon: 'fas fa-chart-bar' },
                { id: 'settings', label: 'Settings', icon: 'fas fa-cog' },
            ];

            return (
                <div className="min-h-screen flex bg-slate-50 font-sans text-gray-900 relative">
                    {notification && (
                        <div className="fixed top-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl border border-slate-700 flex items-center space-x-3 text-sm animate-bounce">
                            <i className="fas fa-info-circle text-blue-400"></i>
                            <span>{notification}</span>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4 border border-gray-100">
                                <h3 className="font-bold text-lg text-gray-800">Confirmation Required</h3>
                                <p className="text-sm text-gray-600">{confirmModal.message}</p>
                                <div className="flex justify-end space-x-3 pt-2">
                                    <Button variant="secondary" onClick={() => setConfirmModal(null)}>Cancel</Button>
                                    <Button variant="danger" onClick={() => { confirmModal.onConfirm(); setConfirmModal(null); }}>Proceed</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    <aside className="w-64 bg-slate-900 text-white flex-shrink-0 hidden md:flex flex-col print:hidden">
                        <div className="p-4 border-b border-slate-800 flex items-center space-x-3">
                            <div className="bg-blue-600 p-2 rounded-lg"><i className="fas fa-file-invoice-dollar text-xl text-white"></i></div>
                            <div><h1 className="font-bold text-lg leading-tight">DG BILLING APP</h1><p className="text-xs text-slate-400">Local PC Edition</p></div>
                        </div>
                        <nav className="flex-1 py-4 space-y-1 px-3">
                            {NAV_ITEMS.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => { setActiveTab(item.id); setViewInvoice(null); setIsCreatingInvoice(false); setEditInvoiceData(null); }}
                                    className={`w-full flex items-center space-x-3 px-3 py-3 rounded-lg text-sm font-medium transition-colors ${activeTab === item.id ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className={`${item.icon} w-5 text-center`}></i><span>{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500 mt-auto">
                            <p className="font-semibold text-slate-400 tracking-wide">Version 2.0.1</p>
                            <p className="mt-1">Last Updated: <br/> Oct 15, 2026</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
                        <header className="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 print:hidden shadow-sm">
                            <div className="flex items-center md:hidden"><h1 className="font-bold text-lg">DG BILLING APP</h1></div>
                            <div className="hidden md:block">
                                <h2 className="text-xl font-semibold text-gray-800 capitalize">
                                    {viewInvoice ? 'Invoice Viewer' : activeTab.replace('-', ' ')}
                                </h2>
                            </div>
                            <div className="flex items-center space-x-4">
                                <select 
                                    className="bg-gray-100 border border-gray-300 text-gray-800 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2"
                                    value={activeCompanyId}
                                    onChange={handleCompanySwitch}
                                >
                                    {companies.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    <option value="NEW" className="font-bold text-blue-600">+ Add New Company</option>
                                </select>
                                <span className="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-semibold border border-green-200 shadow-sm hidden sm:inline-flex items-center">
                                    <i className="fas fa-wifi mr-1"></i> Offline
                                </span>
                                <div className="text-right hidden sm:block">
                                    <p className="text-sm font-bold text-gray-900">{settings?.firmName || 'Setup Business'}</p>
                                    <p className="text-xs text-gray-500">GSTIN: {settings?.gstin || 'N/A'}</p>
                                </div>
                            </div>
                        </header>

                        <div className="flex-1 overflow-auto p-4 md:p-6 print:p-0 print:overflow-visible">
                            {isCreatingInvoice ? (
                                <InvoiceForm 
                                    settings={settings} setSettings={setSettings}
                                    invoices={invoices} setInvoices={setInvoices}
                                    customers={customers} setCustomers={setCustomers}
                                    products={products}
                                    editData={editInvoiceData}
                                     initialDocumentType={newDocumentType}
                                    notify={notify}
                                    activeCompanyId={activeCompanyId}
                                    onCancel={() => { setIsCreatingInvoice(false); setEditInvoiceData(null); }} 
                                    onComplete={(newInv) => { setIsCreatingInvoice(false); setEditInvoiceData(null); if (newInv) { setViewInvoice(newInv); } else { setActiveTab('invoices'); } }}
                                />
                            ) : viewInvoice ? (
                                <InvoiceDetailView invoice={viewInvoice} onBack={() => setViewInvoice(null)} settings={settings} onDuplicate={() => handleDuplicateInvoice(viewInvoice)} />
                            ) : (
                                <>
                                    {activeTab === 'dashboard' && <DashboardView invoices={invoices} onCreateNew={() => { setNewDocumentType('Tax Invoice'); setEditInvoiceData(null); setIsCreatingInvoice(true); }} onViewInvoice={setViewInvoice} />}
                                    {activeTab === 'invoices' && <InvoiceManager invoices={invoices} setInvoices={setInvoices} onViewInvoice={setViewInvoice} onCreateNew={() => { setNewDocumentType('Tax Invoice'); setEditInvoiceData(null); setIsCreatingInvoice(true); }} onEditInvoice={(inv) => { setEditInvoiceData(inv); setIsCreatingInvoice(true); }} onDuplicateInvoice={handleDuplicateInvoice} setConfirmModal={setConfirmModal} notify={notify} settings={settings} />}
                                     {activeTab === 'challans' && <InvoiceManager challanHistory invoices={invoices} setInvoices={setInvoices} onViewInvoice={setViewInvoice} onCreateNew={() => { setNewDocumentType('Job Work Challan'); setEditInvoiceData(null); setIsCreatingInvoice(true); }} onEditInvoice={(inv) => { setEditInvoiceData(inv); setIsCreatingInvoice(true); }} onDuplicateInvoice={handleDuplicateInvoice} setConfirmModal={setConfirmModal} notify={notify} settings={settings} />}
                                    {activeTab === 'customers' && <CustomerManager customers={customers} setCustomers={setCustomers} invoices={invoices} payments={payments} setPayments={setPayments} settings={settings} notify={notify} setConfirmModal={setConfirmModal} onViewInvoice={setViewInvoice} />}
                                    {activeTab === 'products' && <ProductManager products={products} setProducts={setProducts} setConfirmModal={setConfirmModal} notify={notify} />}
                                    {activeTab === 'settings' && <SettingsManager settings={settings} setSettings={setSettings} setInvoices={setInvoices} setCustomers={setCustomers} setProducts={setProducts} setPayments={setPayments} notify={notify} prefix={getPrefix(activeCompanyId)} />}
                                    {activeTab === 'reports' && <ReportsView invoices={invoices} />}
                                </>
                            )}
                        </div>
                    </main>
                </div>
            );
        }

        function DashboardView({ invoices, onCreateNew, onViewInvoice }) {
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            
            const stats = useMemo(() => {
                let todaySales = 0, monthSales = 0, monthGST = 0, outstanding = 0, totalPaid = 0;
                invoices.forEach(inv => {
                    if (inv.status === 'Cancelled') return;
                    const invDate = new Date(inv.invoiceDate);
                    if (new Date().toDateString() === invDate.toDateString()) todaySales += inv.grandTotal;
                    if (invDate.getMonth() === currentMonth && invDate.getFullYear() === currentYear) {
                        monthSales += inv.grandTotal; monthGST += (inv.totalGST || 0);
                    }
                    const paid = parseFloat(inv.amountReceived || 0);
                    totalPaid += paid; outstanding += (inv.grandTotal - paid);
                });
                return { todaySales, monthSales, monthGST, outstanding, totalPaid, count: invoices.length };
            }, [invoices]);

            const formatCurr = (v) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(v);

            return (
                <div className="space-y-6 max-w-7xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                        <div><h2 className="text-2xl font-bold text-gray-800">Dashboard Overview</h2><p className="text-sm text-gray-500">Quick summary of your business performance</p></div>
                        <Button iconClass="fas fa-plus" onClick={onCreateNew} className="mt-4 sm:mt-0 text-base px-6 py-2.5 shadow-md">Create New Bill</Button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Today's Sales" value={formatCurr(stats.todaySales)} color="blue" />
                        <StatCard title="This Month Sales" value={formatCurr(stats.monthSales)} color="green" />
                        <StatCard title="This Month GST" value={formatCurr(stats.monthGST)} color="purple" />
                        <StatCard title="Outstanding Amount" value={formatCurr(stats.outstanding)} color="orange" />
                    </div>
                    <Card className="p-6">
                        <h3 className="text-lg font-semibold mb-4 border-b pb-2">Recent Invoices</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-50 text-gray-600 font-medium border-b border-gray-200">
                                    <tr><th className="p-3">Invoice No</th><th className="p-3">Date</th><th className="p-3">Type</th><th className="p-3">Customer</th><th className="p-3">Amount</th><th className="p-3">Status</th></tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {invoices.slice(0, 10).map(inv => (
                                        <tr key={inv.id} className="hover:bg-gray-50">
                                            <td className="p-3 font-bold text-blue-600 cursor-pointer hover:underline" onClick={() => onViewInvoice(inv)} title="Click to view details">{inv.invoiceNumber}</td>
                                            <td className="p-3">{formatInvoiceDate(inv.invoiceDate)}</td>
                                            <td className="p-3 text-gray-500 text-xs">{inv.invoiceType || 'Tax Invoice'}</td>
                                            <td className="p-3">{inv.customerName}</td>
                                            <td className="p-3 font-medium">{formatCurr(inv.grandTotal)}</td>
                                            <td className="p-3"><span className={`px-2 py-1 text-xs rounded-full ${inv.status === 'Cancelled' ? 'bg-red-100 text-red-700' : (inv.amountReceived >= inv.grandTotal || inv.paymentMode === 'Fully Paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}`}>{inv.status === 'Cancelled' ? 'Cancelled' : (inv.amountReceived >= inv.grandTotal || inv.paymentMode === 'Fully Paid' ? 'Paid' : 'Pending')}</span></td>
                                        </tr>
                                    ))}
                                    {invoices.length === 0 ? (<tr><td colSpan="6" className="p-4 text-center text-gray-500">No invoices yet. Click 'Create New Bill' to start.</td></tr>) : null}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        }
        const StatCard = ({ title, value, color }) => {
            const colors = { blue: 'border-blue-500 text-blue-600 bg-blue-50', green: 'border-green-500 text-green-600 bg-green-50', purple: 'border-purple-500 text-purple-600 bg-purple-50', orange: 'border-orange-500 text-orange-600 bg-orange-50' };
            return <Card className={`p-5 border-l-4 ${colors[color].split(' ')[0]}`}><p className="text-sm font-medium text-gray-500">{title}</p><p className={`text-2xl font-bold mt-1 ${colors[color].split(' ')[1]}`}>{value}</p></Card>;
        };

        function InvoiceManager({ invoices, setInvoices, onViewInvoice, onCreateNew, onEditInvoice, onDuplicateInvoice, setConfirmModal, notify, settings, challanHistory = false }) {
            const [openDropdown, setOpenDropdown] = useState(null);
            const [pinPromptId, setPinPromptId] = useState(null);
            const [enteredPin, setEnteredPin] = useState("");
            const [filterType, setFilterType] = useState('All');
            const [searchText, setSearchText] = useState(''); 

            const handleDownload = (inv) => {
                onViewInvoice(inv);
                setTimeout(() => { const btn = document.getElementById('btn-download-pdf'); if(btn) btn.click(); }, 500);
                setOpenDropdown(null);
            };
            const handlePrintFromHistory = (inv) => {
                onViewInvoice(inv);
                setTimeout(() => { const btn = document.getElementById('btn-print-invoice'); if (btn) btn.click(); }, 500);
                setOpenDropdown(null);
            };

            const cancelInvoice = (id) => {
                setConfirmModal({
                    message: "Are you sure you want to cancel this invoice? It will be marked as cancelled for audit history.",
                    onConfirm: () => {
                        setInvoices(invoices.map(inv => inv.id === id ? { ...inv, status: 'Cancelled' } : inv));
                        notify("Invoice cancelled successfully.");
                    }
                });
                setOpenDropdown(null);
            };

            const handleDeleteInvoice = (id) => {
                if (!settings?.deletePin) {
                    notify("Please setup a Deletion PIN in Settings first.");
                    return;
                }
                setPinPromptId(id);
                setOpenDropdown(null);
            };

            const confirmDeletion = () => {
                if (enteredPin === settings.deletePin) {
                    setInvoices(invoices.filter(inv => inv.id !== pinPromptId));
                    notify("Invoice deleted permanently.");
                    setPinPromptId(null);
                    setEnteredPin("");
                } else {
                    notify("Incorrect PIN. Deletion aborted.");
                    setEnteredPin("");
                }
            };

            useEffect(() => {
                const closeMenu = () => setOpenDropdown(null);
                document.addEventListener('click', closeMenu);
                return () => document.removeEventListener('click', closeMenu);
            }, []);

            const filteredInvoices = useMemo(() => {
                return invoices.filter(inv => {
                    const challan = isChallanDocument(inv.invoiceType);
                    if (challanHistory ? !challan : (filterType === 'Tax Invoice' && challan) || (filterType === 'Challan Bill' && !challan)) return false;
                    const text = `${inv.invoiceNumber || ''} ${inv.customerName || ''} ${inv.invoiceDate || ''} ${inv.invoiceType || ''}`.toLowerCase();
                    return text.includes(searchText.trim().toLowerCase());
                });
            }, [invoices, filterType, searchText, challanHistory]);

            return (
                <div className="space-y-4 relative">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-xl font-bold">{challanHistory ? 'Challan History' : 'All Invoices'}</h2>
                        <div className="flex items-center space-x-3 w-full md:w-auto">
                            <input aria-label="Search bills" value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="Search number / customer..." className="w-40 sm:w-56 px-3 py-2 text-sm border border-gray-300 rounded-md" />
                            {!challanHistory && <div className="flex items-center bg-white border border-gray-300 rounded-md px-3 py-1.5 shadow-sm">
                                <label className="text-sm font-medium text-gray-500 mr-2"><i className="fas fa-filter"></i> Filter:</label>
                                <select 
                                    value={filterType} 
                                    onChange={(e) => setFilterType(e.target.value)}
                                    className="bg-transparent border-none text-sm font-semibold text-gray-800 focus:outline-none focus:ring-0 cursor-pointer"
                                >
                                    <option value="All">All Bills</option>
                                    <option value="Tax Invoice">Tax Invoices</option>
                                    <option value="Challan Bill">Challan Bills</option>
                                </select>
                            </div>}
                            <Button iconClass="fas fa-plus" onClick={onCreateNew}>{challanHistory ? 'Create Challan' : 'Create Invoice'}</Button>
                        </div>
                    </div>
                    
                    {pinPromptId && (
                        <div className="fixed inset-0 z-[100] bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4">
                                <h3 className="font-bold text-lg text-red-600 border-b pb-2"><i className="fas fa-exclamation-triangle mr-2"></i>Security Authorization</h3>
                                <p className="text-sm text-gray-600">Enter your PIN to permanently delete this cancelled bill.</p>
                                <input type="password" value={enteredPin} onChange={(e) => setEnteredPin(e.target.value)} className="w-full border border-gray-300 rounded px-3 py-2 text-center tracking-widest text-lg focus:ring-red-500 focus:border-red-500" placeholder="****" autoFocus />
                                <div className="flex justify-end space-x-3 pt-2">
                                    <Button onClick={() => { setPinPromptId(null); setEnteredPin(""); }} variant="secondary">Cancel</Button>
                                    <Button onClick={confirmDeletion} variant="danger">Delete Bill</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    <Card className="overflow-visible min-h-[400px]">
                        <div className="overflow-x-auto overflow-y-visible">
                            <table className="w-full text-left text-sm relative">
                                <thead className="bg-gray-100 text-gray-700 border-b">
                                    <tr><th className="p-4 font-semibold">Invoice No</th><th className="p-4 font-semibold">Date</th><th className="p-4 font-semibold">Type</th><th className="p-4 font-semibold">Customer</th><th className="p-4 font-semibold">Amount</th><th className="p-4 font-semibold">Status</th><th className="p-4 font-semibold text-right">Actions</th></tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {filteredInvoices.map(inv => (
                                        <tr key={inv.id} className="hover:bg-gray-50 transition-colors">
                                            <td className="p-4 font-medium">
                                                <button
                                                    type="button"
                                                    onClick={() => onViewInvoice(inv)}
                                                    className="text-blue-600 font-semibold hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 rounded"
                                                    title={`View invoice ${inv.invoiceNumber}`}
                                                    aria-label={`View details for invoice ${inv.invoiceNumber}`}
                                                >
                                                    {inv.invoiceNumber}
                                                </button>
                                            </td>
                                            <td className="p-4">{formatInvoiceDate(inv.invoiceDate)}</td>
                                            <td className="p-4 text-xs font-bold text-gray-600">{inv.invoiceType || 'Tax Invoice'}</td>
                                            <td className="p-4"><div>{inv.customerName}</div><div className="text-xs text-gray-500">GST: {inv.customerGstin || 'N/A'}</div></td>
                                            <td className="p-4 font-medium">₹{inv.grandTotal.toFixed(2)}</td>
                                            <td className="p-4"><span className={`px-2 py-1 text-xs rounded-full ${inv.status === 'Cancelled' ? 'bg-red-100 text-red-700' : (inv.amountReceived >= inv.grandTotal || inv.paymentMode === 'Fully Paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700')}`}>{inv.status === 'Cancelled' ? 'Cancelled' : (inv.amountReceived >= inv.grandTotal || inv.paymentMode === 'Fully Paid' ? 'Paid' : 'Pending')}</span></td>
                                            <td className="p-4 text-right relative">
                                                <button onClick={(e) => { e.stopPropagation(); setOpenDropdown(openDropdown === inv.id ? null : inv.id); }} className="p-2 text-gray-500 hover:bg-gray-200 rounded">
                                                    <i className="fas fa-ellipsis-v px-1"></i>
                                                </button>

                                                {openDropdown === inv.id && (
                                                    <div onClick={(e) => e.stopPropagation()} className="absolute right-8 top-10 w-48 bg-white border border-gray-200 shadow-xl rounded-md py-2 z-50 flex flex-col text-left">
                                                        <button onClick={() => { onViewInvoice(inv); setOpenDropdown(null); }} className="px-4 py-2 hover:bg-blue-50 text-gray-700 text-sm"><i className="fas fa-eye w-5 text-blue-600"></i> View Bill</button>
                                                        <button onClick={() => { onEditInvoice(inv); setOpenDropdown(null); }} className="px-4 py-2 hover:bg-blue-50 text-gray-700 text-sm"><i className="fas fa-edit w-5 text-orange-600"></i> Edit Bill</button>
                                                        <button onClick={() => { onDuplicateInvoice(inv); setOpenDropdown(null); }} className="px-4 py-2 hover:bg-blue-50 text-gray-700 text-sm"><i className="fas fa-copy w-5 text-purple-600"></i> Duplicate</button>
                                                        <button onClick={() => handleDownload(inv)} className="px-4 py-2 hover:bg-blue-50 text-gray-700 text-sm"><i className="fas fa-download w-5 text-green-600"></i> Download PDF</button>
                                                        <button onClick={() => handlePrintFromHistory(inv)} className="px-4 py-2 hover:bg-blue-50 text-gray-700 text-sm border-b border-gray-100"><i className="fas fa-print w-5 text-blue-600"></i> Print</button>
                                                        
                                                        {inv.status !== 'Cancelled' ? (
                                                            <button onClick={() => cancelInvoice(inv.id)} className="px-4 py-2 mt-1 hover:bg-red-50 text-red-600 font-medium text-sm"><i className="fas fa-times w-5"></i> Cancel Bill</button>
                                                        ) : (
                                                            <button onClick={() => handleDeleteInvoice(inv.id)} className="px-4 py-2 mt-1 hover:bg-red-50 text-red-700 font-bold text-sm"><i className="fas fa-trash-alt w-5"></i> Delete Permanently</button>
                                                        )}
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ))}
                                    {filteredInvoices.length === 0 ? (<tr><td colSpan="7" className="p-8 text-center text-gray-500">No {filterType !== 'All' ? filterType + 's' : 'invoices'} found.</td></tr>) : null}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        }

        function InvoiceForm({ settings, setSettings, invoices, setInvoices, customers, setCustomers, products, editData, initialDocumentType, notify, activeCompanyId, onCancel, onComplete }) {
            const [formData, setFormData] = useState(editData || {
                invoiceType: initialDocumentType || 'Tax Invoice', 
                invoiceNumber: '', invoiceDate: new Date().toISOString().split('T')[0],
                customerName: '', customerGstin: '', customerMobile: '', customerEmail: '',
                billingAddress: '', shippingAddress: '', placeOfSupplyCode: '', ewayBill: '',
                items: [{ id: Date.now(), name: '', sku: '', hsn: '', qty: 1, unit: 'PCS', rate: 0, discount: 0, gstRate: 18 }],
                amountReceived: 0, paymentMode: 'Unpaid'
            });

            const isChallan = isChallanDocument(formData.invoiceType);

            useEffect(() => {
                if (editData) return;
                const draftKey = isChallanDocument(initialDocumentType) ? `gst-challan-draft-${activeCompanyId}` : `gst-invoice-draft-${activeCompanyId}`;
                const draft = localStorage.getItem(draftKey);
                if (draft) { try { const parsed = JSON.parse(draft); if (parsed && Object.keys(parsed).length > 0) setFormData(parsed); } catch (e) {} }
            }, [activeCompanyId, editData]);
            
            useEffect(() => {
                if (!editData) localStorage.setItem(`${isChallan ? 'gst-challan-draft' : 'gst-invoice-draft'}-${activeCompanyId}`, JSON.stringify(formData));
            }, [formData, editData, activeCompanyId, isChallan]);

            const calculateTotals = () => {
                let subtotal = 0, totalDiscount = 0, totalTaxable = 0, totalCGST = 0, totalSGST = 0, totalIGST = 0;
                const isInterState = settings?.stateCode && formData.placeOfSupplyCode && settings.stateCode !== formData.placeOfSupplyCode;

                const processedItems = formData.items.map(item => {
                    const amount = roundPaise(decimalMultiply(item.qty, item.rate));
                    const discountAmt = roundPaise(decimalMultiply(amount, item.discount || 0) / 100);
                    const taxable = roundPaise(amount - discountAmt);
                    let cgst = 0, sgst = 0, igst = 0;
                    
                    let taxAmt = roundPaise(decimalMultiply(taxable, item.gstRate || 0) / 100);
                    
                    if (isChallan) {
                        cgst = 0; sgst = 0; igst = 0; taxAmt = 0;
                    } else if (isInterState) {
                        igst = taxAmt;
                    } else { 
                        cgst = roundPaise(taxAmt / 2); sgst = roundPaise(taxAmt - cgst); 
                    }

                    subtotal = roundPaise(subtotal + amount);
                    totalDiscount = roundPaise(totalDiscount + discountAmt);
                    totalTaxable = roundPaise(totalTaxable + taxable);
                    totalCGST = roundPaise(totalCGST + cgst);
                    totalSGST = roundPaise(totalSGST + sgst);
                    totalIGST = roundPaise(totalIGST + igst);
                    return { ...item, amount, taxable, cgst, sgst, igst, total: roundPaise(taxable + taxAmt) };
                });

                const totalGST = roundPaise(totalCGST + totalSGST + totalIGST);
                const preRoundTotal = roundPaise(totalTaxable + totalGST);
                const grandTotal = Math.round(preRoundTotal);
                const roundOff = roundPaise(grandTotal - preRoundTotal); 

                return { items: processedItems, subtotal, totalDiscount, totalTaxable, totalCGST, totalSGST, totalIGST, totalGST, roundOff, grandTotal };
            };

            const totals = calculateTotals();

            const handleSave = (e) => {
                e.preventDefault();
                if (!settings?.prefix && !isChallan && !formData.invoiceNumber) {
                    notify('Please configure Business Settings first (Invoice Prefix required).');
                    return;
                }
                if (editData?.id && isChallanDocument(editData.invoiceType) !== isChallan) {
                    notify('To change between Tax Invoice and Challan, create a new document instead of converting an existing number.');
                    return;
                }
                if (!formData.items.length || formData.items.some(item =>
                    displayQty(item.qty).trim() === '' || !Number.isFinite(Number(item.qty)) ||
                    Number(item.qty) < 0.001 || !Number.isFinite(Number(item.rate)) || Number(item.rate) < 0 ||
                    !Number.isFinite(Number(item.discount)) || Number(item.discount) < 0 || Number(item.discount) > 100
                )) {
                    notify('Invalid Qty/Weight, rate or discount. Enter a positive Qty/Weight of at least 0.001 for every item.');
                    return;
                }
                const fy = getFinancialYear(new Date(formData.invoiceDate + 'T12:00:00'));
                const seqKey = isChallan ? 'challanNextSeq' : 'nextSeq';
                const fyKey = isChallan ? 'challanFY' : 'currentFY';
                const configuredPrefix = String(isChallan ? (settings.challanPrefix ?? 'AGF-CH') : settings.prefix).trim();
                if (!configuredPrefix) { notify('Please configure a document prefix in Invoice Settings.'); return; }
                let nextSeq = positiveSeq(settings[seqKey]) ? Number(settings[seqKey]) : 1;
                if ((settings[fyKey] || getFinancialYear()) !== fy && !(editData && editData.id)) nextSeq = 1;
                let finalInvoiceNumber = String(formData.invoiceNumber || '').trim();
                const savedNumbers = invoices.map(inv => String(inv.invoiceNumber || '').toLowerCase());
                if (!finalInvoiceNumber) {
                    let tempSeq = nextSeq;
                    let candidate = challanNumber(configuredPrefix, fy, tempSeq);
                    while (savedNumbers.includes(candidate.toLowerCase())) {
                        tempSeq++;
                        candidate = challanNumber(configuredPrefix, fy, tempSeq);
                    }
                    finalInvoiceNumber = candidate;
                    nextSeq = tempSeq;
                } else if (invoices.some(inv => String(inv.invoiceNumber || '').toLowerCase() === finalInvoiceNumber.toLowerCase() && inv.id !== editData?.id)) {
                    notify(`Validation Error: Bill Number '${finalInvoiceNumber}' already exists.`);
                    return;
                }

                // Chronology checks apply only within a document sequence and financial year.
                const currentNumMatch = finalInvoiceNumber.match(/(\d+)$/);
                const currentNum = currentNumMatch ? Number(currentNumMatch[1]) : 0;
                const currentDateTime = new Date(formData.invoiceDate + 'T12:00:00').getTime();
                for (const inv of invoices) {
                    if (editData && inv.id === editData.id) continue;
                    if (isChallanDocument(inv.invoiceType) !== isChallan) continue;
                    if (getFinancialYear(new Date(inv.invoiceDate + 'T12:00:00')) !== fy) continue;
                    const otherMatch = String(inv.invoiceNumber || '').match(/(\d+)$/);
                    const otherNum = otherMatch ? Number(otherMatch[1]) : 0;
                    const samePrefix = String(inv.invoiceNumber || '').startsWith(configuredPrefix + '-' + fy + '-');
                    if (!samePrefix || !otherNum || !currentNum) continue;
                    const otherTime = new Date(inv.invoiceDate + 'T12:00:00').getTime();
                    if ((currentNum > otherNum && currentDateTime < otherTime) || (currentNum < otherNum && currentDateTime > otherTime)) {
                        notify(`Chronological Error: ${finalInvoiceNumber} date conflicts with ${inv.invoiceNumber} (${inv.invoiceDate}).`);
                        return;
                    }
                }

                let finalInvoice = null;

                if (editData && editData.id) {
                    finalInvoice = { ...formData, ...totals, invoiceNumber: finalInvoiceNumber, updatedAt: Date.now() };
                    setInvoices(invoices.map(inv => inv.id === editData.id ? finalInvoice : inv));
                    notify(`${formData.invoiceType} updated successfully.`);
                } else {
                    finalInvoice = { ...formData, ...totals, invoiceNumber: finalInvoiceNumber, id: 'inv_' + Date.now(), createdAt: Date.now(), status: 'Generated' };
                    setInvoices([finalInvoice, ...invoices]);
                    
                    // Separate sequences; manual numbers in the configured format also advance the counter.
                    const generatedPattern = `${configuredPrefix}-${fy}-`;
                    const manualSequence = finalInvoiceNumber.startsWith(generatedPattern)
                        ? Number(finalInvoiceNumber.slice(generatedPattern.length)) : 0;
                    const incremented = Math.max(nextSeq + 1, Number.isSafeInteger(manualSequence) ? manualSequence + 1 : 1);
                    const currentFY = settings[fyKey] || getFinancialYear();
                    const storedNext = currentFY === fy && positiveSeq(settings[seqKey]) ? Number(settings[seqKey]) : 1;
                    setSettings(prev => ({ ...prev, [seqKey]: Math.max(incremented, currentFY === fy ? storedNext : 1), [fyKey]: fy }));
                    localStorage.removeItem(`${isChallan ? 'gst-challan-draft' : 'gst-invoice-draft'}-${activeCompanyId}`);
                    notify(`${formData.invoiceType} generated successfully.`);
                }

                if (formData.customerName && formData.customerName.trim() !== '') {
                    const isExisting = customers.some(c => c.name.toLowerCase() === formData.customerName.toLowerCase());
                    if (!isExisting) {
                        const newCust = {
                            id: 'cust_' + Date.now(),
                            name: formData.customerName, gstin: formData.customerGstin || '', mobile: formData.customerMobile || '',
                            billingAddress: formData.billingAddress || '', stateCode: formData.placeOfSupplyCode || ''
                        };
                        setCustomers([...customers, newCust]);
                    }
                }
                onComplete(finalInvoice);
            };

            return (
                <Card className="p-4 md:p-6 bg-white max-w-6xl mx-auto border-t-4 border-blue-600 shadow-lg">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold flex items-center">
                            <button onClick={onCancel} className="mr-3 text-gray-500 hover:text-gray-900 bg-gray-100 p-1.5 rounded-full"><i className="fas fa-chevron-left w-5 h-5 flex items-center justify-center"></i></button>
                            {editData && editData.id ? 'Edit Bill' : 'Create New Bill'}
                        </h2>
                    </div>

                    <form onSubmit={handleSave} className="space-y-8">
                        <div className="grid grid-cols-1 md:grid-cols-5 gap-4 bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <Select label="Document Type" value={formData.invoiceType || 'Tax Invoice'} options={['Tax Invoice', 'Job Work Challan', 'Delivery Challan', ...(formData.invoiceType === 'Challan Bill' ? ['Challan Bill'] : [])]} onChange={e => setFormData({...formData, invoiceType: e.target.value, invoiceNumber: editData?.id ? formData.invoiceNumber : ''})} required />
                            <Input label={isChallan ? 'Challan Number' : 'Invoice Number'} value={formData.invoiceNumber} onChange={e => setFormData({...formData, invoiceNumber: e.target.value})} placeholder={editData?.id ? '' : `Auto: ${challanNumber(isChallan ? (settings.challanPrefix || 'AGF-CH') : (settings.prefix || 'INV'), getFinancialYear(new Date(formData.invoiceDate + 'T12:00:00')), isChallan ? (settings.challanNextSeq || 1) : (settings.nextSeq || 1))}`} />
                            <Input label="Invoice Date" type="date" value={formData.invoiceDate} onChange={e => setFormData({...formData, invoiceDate: e.target.value})} required />
                            <div className="md:col-span-2">
                                <Select label="Quick Fill Saved Customer" options={[{label: '-- Select Customer --', value: 'NEW'}, ...customers.map(c => ({label: c.name, value: c.id}))]} onChange={e => {
                                    const c = customers.find(x => x.id === e.target.value);
                                    if(c) setFormData(p => ({ ...p, customerName: c.name, customerGstin: c.gstin, customerMobile: c.mobile, billingAddress: c.billingAddress, placeOfSupplyCode: c.stateCode }));
                                }} />
                            </div>
                        </div>

                        <div className="bg-gray-50 p-4 rounded-lg border border-gray-100">
                            <h3 className="text-sm font-semibold text-gray-700 mb-4 border-b pb-2">Customer Details</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <Input label="Customer / Business Name" value={formData.customerName} onChange={e => setFormData({...formData, customerName: e.target.value})} required />
                                <Input label="GSTIN" value={formData.customerGstin} onChange={e => setFormData({...formData, customerGstin: e.target.value})} />
                                <Select label="Place of Supply (State)" value={formData.placeOfSupplyCode} options={STATES} onChange={e => setFormData({...formData, placeOfSupplyCode: e.target.value})} required />
                                <div className="col-span-1 md:col-span-2"><Input label="Billing Address" value={formData.billingAddress} onChange={e => setFormData({...formData, billingAddress: e.target.value})} /></div>
                                <Input label="Mobile Number" value={formData.customerMobile} onChange={e => setFormData({...formData, customerMobile: e.target.value})} />
                                <Input label="E-Way Bill No (Optional)" value={formData.ewayBill} onChange={e => setFormData({...formData, ewayBill: e.target.value})} />
                            </div>
                        </div>

                        <div>
                            <div className="overflow-x-auto border border-gray-200 rounded-lg">
                                <table className="w-full text-sm text-left">
                                    <thead className="bg-gray-100 text-gray-700">
                                        <tr><th className="p-2 w-1/4">Item Name</th><th className="p-2 w-24">HSN</th><th className="p-2 w-28">Qty/Weight</th><th className="p-2 w-20">Unit</th><th className="p-2 w-24">Rate (₹)</th><th className="p-2 w-20">Disc %</th>{!isChallan && <th className="p-2 w-24">GST %</th>}<th className="p-2 w-32">Total</th><th className="p-2 w-10"></th></tr>
                                    </thead>
                                    <tbody className="divide-y">
                                        {formData.items.map((item, index) => (
                                            <tr key={item.id} className="hover:bg-gray-50">
                                                <td className="p-2">
                                                    <input type="text" className="w-full border-gray-300 rounded p-1 text-sm" value={item.name} placeholder="Item description..." required
                                                        onChange={e => {
                                                            const val = e.target.value; const newItems = [...formData.items]; newItems[index].name = val;
                                                            const prod = products.find(p => p.name.toLowerCase() === val.toLowerCase());
                                                            if(prod && item.rate === 0) { newItems[index].rate = parseFloat(prod.price||0); newItems[index].hsn = prod.hsn||''; newItems[index].gstRate = parseFloat(prod.gst||18); }
                                                            setFormData({...formData, items: newItems});
                                                        }} />
                                                </td>

        // Ledger invoice PDF: render the existing invoice template without navigating away.
        // window.open must happen synchronously on click so popup blockers allow the new tab.
        async function openInvoicePdfInNewTab(invoice, settings, notify) {
            if (!invoice || !invoice.id) {
                notify('Invoice record not found. The PDF cannot be opened.');
                return;
            }
            const pdfTab = window.open('', '_blank');
            if (!pdfTab) {
                notify('Your browser blocked the PDF tab. Please allow pop-ups for this app and try again.');
                return;
            }

            let pdfHost = null;
            let renderRoot = null;
            try {
                pdfTab.document.title = `Invoice ${invoice.invoiceNumber || ''} - Preparing PDF`;
                pdfTab.document.body.style.cssText = 'font-family:Arial,sans-serif;padding:24px;color:#334155;';
                pdfTab.document.body.textContent = 'Preparing invoice PDF...';
                pdfTab.opener = null;

                if (typeof window.html2pdf !== 'function') {
                    throw new Error('PDF library is unavailable. Connect to the internet to load the PDF library, then retry.');
                }
                pdfHost = document.createElement('div');
                pdfHost.setAttribute('aria-hidden', 'true');
                // Keep the element renderable for html2canvas; display:none or visibility:hidden
                // would produce an empty PDF. The negative stacking order keeps it behind the UI.
                Object.assign(pdfHost.style, {
                    position: 'absolute', left: '0', top: '0', width: '210mm',
                    background: '#ffffff', zIndex: '-10', pointerEvents: 'none'
                });
                document.body.appendChild(pdfHost);
                renderRoot = ReactDOM.createRoot(pdfHost);
                ReactDOM.flushSync(() => renderRoot.render(
                    <div className="print-area w-full">
                        {['Original for Recipient', 'Duplicate for Transporter / Supplier'].map((copyType, index) => (
                            <div key={copyType} className={index === 1 ? 'break-page' : ''}>
                                <StandardInvoiceTemplate invoice={invoice} settings={settings} copyType={copyType} />
                            </div>
                        ))}
                    </div>
                ));

                // Allow embedded logos, signatures and QR images to load before capture.
                await Promise.all(Array.from(pdfHost.querySelectorAll('img')).map(img => {
                    if (img.complete) return Promise.resolve();
                    return new Promise(resolve => {
                        img.addEventListener('load', resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                        setTimeout(resolve, 3000);
                    });
                }));
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

                const pdfContent = pdfHost.firstElementChild;
                if (!pdfContent) throw new Error('Unable to render the invoice layout.');
                const options = {
                    margin: 0,
                    filename: `${invoice.invoiceNumber || 'Invoice'}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak: { mode: 'css', before: '.break-page' }
                };
                const pdf = await window.html2pdf().set(options).from(pdfContent).toPdf().get('pdf');
                const blob = pdf.output('blob');
                if (!blob || !blob.size) throw new Error('Generated PDF is empty.');
                const pdfUrl = URL.createObjectURL(blob);
                // Keep the object URL alive for the PDF viewer's Print/Download actions.
                // It is released automatically when this application document unloads.
                pdfTab.location.replace(pdfUrl);
            } catch (error) {
                console.error('Could not open ledger invoice PDF:', error);
                const message = error && error.message ? error.message : 'Unknown PDF generation error.';
                notify(`Unable to open invoice PDF: ${message}`);
                try {
                    if (!pdfTab.closed) pdfTab.document.body.textContent = `Unable to open invoice PDF: ${message}`;
                } catch (_) { /* The user may have closed the tab. */ }
            } finally {
                if (renderRoot) renderRoot.unmount();
                if (pdfHost) pdfHost.remove();
            }
        }

        function InvoiceDetailView({ invoice, onBack, settings, onDuplicate, isPrintMode = false }) {
            const [isProcessing, setIsProcessing] = useState(false);
            const [isPdfMode, setIsPdfMode] = useState(false);
            const [shareText, setShareText] = useState('Share');

            const getPdfOptions = () => ({
                margin: 0,
                filename: `${invoice.invoiceNumber}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: 'css', before: '.break-page' }
            });

            const handlePrint = () => {
                setIsPdfMode(true);
                setTimeout(() => {
                    window.print();
                    setIsPdfMode(false);
                }, 150);
            };

            const handleDownload = () => {
                setIsProcessing(true);
                setIsPdfMode(true);
                setTimeout(() => {
                    const element = document.getElementById(`print-area-${invoice.id}`);
                    if (window.html2pdf) {
                        window.html2pdf().set(getPdfOptions()).from(element).save().then(() => {
                            setIsPdfMode(false);
                            setIsProcessing(false);
                        });
                    } else {
                        alert("PDF Library not loaded. Please ensure internet access.");
                        setIsPdfMode(false);
                        setIsProcessing(false);
                    }
                }, 150);
            };

            const handleWhatsApp = () => {
                setIsProcessing(true);
                setShareText('Preparing PDF...');
                setIsPdfMode(true);
                
                setTimeout(() => {
                    const element = document.getElementById(`print-area-${invoice.id}`);
                    if (window.html2pdf) {
                        window.html2pdf().set(getPdfOptions()).from(element).toPdf().get('pdf').then((pdf) => {
                            const pdfBlob = pdf.output('blob');
                            const file = new File([pdfBlob], `${invoice.invoiceNumber.replace(/[^a-zA-Z0-9-]/g, '_')}.pdf`, { type: 'application/pdf' });
                            
                            const statusStr = invoice.amountReceived >= invoice.grandTotal || invoice.paymentMode === 'Fully Paid' ? 'Paid' : 'Pending';
                            const text = `Hello ${invoice.customerName},\n\nHere are the details for your Invoice No: *${invoice.invoiceNumber}*.\nDate: ${formatInvoiceDate(invoice.invoiceDate)}\nTotal Amount: *₹${invoice.grandTotal.toFixed(2)}*\nStatus: ${statusStr}\n\nThank you for your business!`;

                            setIsPdfMode(false);
                            setIsProcessing(false);
                            setShareText('Share');

                            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                                navigator.share({
                                    files: [file],
                                    title: `Invoice ${invoice.invoiceNumber}`,
                                    text: text
                                }).catch(error => console.log('Sharing canceled or failed', error));
                            } else {
                                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
                                alert("Direct PDF document sharing is not supported by your current browser/device. Text has been opened in WhatsApp instead.");
                            }
                        }).catch(() => {
                            setIsPdfMode(false);
                            setIsProcessing(false);
                            setShareText('Share');
                        });
                    } else {
                        alert("PDF Library not loaded.");
                        setIsPdfMode(false);
                        setIsProcessing(false);
                        setShareText('Share');
                    }
                }, 150);
            };

            return (
                <div className={`max-w-4xl mx-auto ${isPrintMode ? '' : 'pb-10'}`}>
                    {!isPrintMode && (
                        <div className="flex justify-between items-center mb-4 print:hidden gap-2 flex-wrap">
                            <Button variant="secondary" onClick={onBack} iconClass="fas fa-chevron-left">Back</Button>
                            
                            <div className="space-x-2 flex flex-wrap gap-y-2 justify-end">
                                <button onClick={handleWhatsApp} disabled={isProcessing} className="px-3 py-2 bg-green-50 text-green-700 rounded hover:bg-green-100 font-medium text-sm flex items-center border border-green-200 transition-colors disabled:opacity-50" title="Share PDF via WhatsApp">
                                    <i className="fab fa-whatsapp mr-1.5 text-base"></i> {shareText}
                                </button>
                                
                                <Button variant="secondary" onClick={onDuplicate} iconClass="fas fa-copy" title="Copy data to new bill">Duplicate</Button>
                                <Button id="btn-download-pdf" variant="success" onClick={handleDownload} iconClass="fas fa-download" disabled={isProcessing}>{isProcessing && shareText === 'Share' ? 'Processing...' : 'Download PDF'}</Button>
                                <Button id="btn-print-invoice" onClick={handlePrint} iconClass="fas fa-print" disabled={isProcessing}>Print Direct</Button>
                            </div>
                        </div>
                    )}

                    <div id={`print-area-${invoice.id}`} className="print-area w-full">
                        {['Original for Recipient', 'Duplicate for Transporter / Supplier']
                            .filter((_, i) => (!isPrintMode && !isPdfMode) ? i === 0 : true)
                            .map((copyType, index) => (
                            <div 
                                key={index} 
                                className={`${index === 1 ? "break-page" : ""} ${(!isPrintMode && !isPdfMode && index === 0) ? 'shadow-sm border border-gray-200 mb-8' : ''}`}
                            >
                                <StandardInvoiceTemplate invoice={invoice} settings={settings} copyType={copyType} />
                            </div>
                        ))}
                    </div>
                </div>
            );
