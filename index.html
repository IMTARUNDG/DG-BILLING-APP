        function CustomerManager({ customers, setCustomers, invoices, payments, setPayments, settings, notify, setConfirmModal, onViewInvoice }) {
            const [showForm, setShowForm] = useState(false);
            const [editId, setEditId] = useState(null);
            const [formData, setFormData] = useState({ name: '', gstin: '', mobile: '', email: '', billingAddress: '', stateCode: '' });
            const [selectedParty, setSelectedParty] = useState(null);
            const [partySearch, setPartySearch] = useState('');
            const filteredCustomers = useMemo(() => {
                const query = partySearch.trim().toLocaleLowerCase();
                return query ? customers.filter(c => String(c.name || '').toLocaleLowerCase().includes(query)) : customers;
            }, [customers, partySearch]);

            const getOutstanding = (party) => {
                let bal = 0;
                (invoices || []).filter(i => i.customerName === party.name && i.status !== 'Cancelled').forEach(inv => { bal += (inv.grandTotal || 0); bal -= (inv.amountReceived || 0); });
                (payments || []).filter(p => p.partyId === party.id).forEach(pay => { if(pay.type === 'IN') bal -= Number(pay.amount); if(pay.type === 'OUT') bal += Number(pay.amount); });
                return bal;
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (editId) {
                    setCustomers(customers.map(c => c.id === editId ? { ...formData, id: editId } : c));
                    notify("Party updated successfully.");
                } else {
                    setCustomers([...customers, { ...formData, id: 'cust_'+Date.now() }]);
                    notify("Party saved successfully.");
                }
                setShowForm(false);
                setEditId(null);
                setFormData({ name: '', gstin: '', mobile: '', email: '', billingAddress: '', stateCode: '' });
            };

            const handleEdit = (party) => {
                setEditId(party.id);
                setFormData({ name: party.name, gstin: party.gstin || '', mobile: party.mobile || '', email: party.email || '', billingAddress: party.billingAddress || '', stateCode: party.stateCode || '' });
                setShowForm(true);
            };

            const handleDelete = (id) => {
                setConfirmModal({
                    message: "Are you sure you want to delete this party? (Associated invoices & payments will remain safe).",
                    onConfirm: () => {
                        setCustomers(customers.filter(c => c.id !== id));
                        notify("Party deleted successfully.");
                    }
                });
            };

            if (selectedParty) return <PartyProfile party={selectedParty} onBack={() => setSelectedParty(null)} invoices={invoices} payments={payments} setPayments={setPayments} settings={settings} notify={notify} onViewInvoice={onViewInvoice} />;

            return (
                <div className="space-y-4 max-w-6xl mx-auto relative">
                    <div className="flex justify-between items-center">
                        <h2 className="text-xl font-bold">Parties & Customers</h2>
                        <Button iconClass="fas fa-plus" onClick={() => { setEditId(null); setFormData({ name: '', gstin: '', mobile: '', email: '', billingAddress: '', stateCode: '' }); setShowForm(!showForm); }}>{showForm ? 'Close Form' : 'Add Party'}</Button>
                    </div>
                    <div className="relative max-w-md w-full">
                        <label htmlFor="party-name-search" className="sr-only">Search Party or Customer by Name</label>
                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" aria-hidden="true"></i>
                        <input
                            id="party-name-search"
                            type="search"
                            value={partySearch}
                            onChange={e => setPartySearch(e.target.value)}
                            placeholder="Search Party or Customer by Name..."
                            className="w-full pl-10 pr-10 py-2.5 border border-gray-300 bg-white rounded-md shadow-sm text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                            autoComplete="off"
                        />
                        {partySearch && (
                            <button
                                type="button"
                                onClick={() => setPartySearch('')}
                                className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800"
                                aria-label="Clear party search"
                                title="Clear search"
                            >
                                <i className="fas fa-times" aria-hidden="true"></i>
                            </button>
                        )}
                    </div>
                    {showForm && (
                        <Card className="p-4 bg-gray-50 border border-blue-200">
                            <h3 className="text-sm font-bold text-blue-800 mb-3">{editId ? 'Edit Party' : 'Add New Party'}</h3>
                            <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <Input label="Party / Customer Name" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                <Input label="GSTIN" value={formData.gstin} onChange={e => setFormData({...formData, gstin: e.target.value})} />
                                <Input label="Mobile" value={formData.mobile} onChange={e => setFormData({...formData, mobile: e.target.value})} />
                                <div className="col-span-1 md:col-span-2"><Input label="Billing Address" value={formData.billingAddress} onChange={e => setFormData({...formData, billingAddress: e.target.value})} /></div>
                                <Select label="State" value={formData.stateCode} options={STATES} onChange={e => setFormData({...formData, stateCode: e.target.value})} required />
                                <div className="col-span-1 md:col-span-3 flex justify-end space-x-2">
                                    <Button variant="secondary" onClick={() => { setShowForm(false); setEditId(null); }}>Cancel</Button>
                                    <Button type="submit">{editId ? 'Update Party' : 'Save Party'}</Button>
                                </div>
                            </form>
                        </Card>
                    )}
                    <Card>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-100 border-b text-gray-700"><tr><th className="p-4 font-semibold">Party Name</th><th className="p-4 font-semibold">Contact / GSTIN</th><th className="p-4 font-semibold text-right">Outstanding Balance</th><th className="p-4 font-semibold text-right">Action</th></tr></thead>
                                <tbody className="divide-y divide-gray-200">
                                    {filteredCustomers.map(c => {
                                        const out = getOutstanding(c);
                                        return (
                                            <tr key={c.id} className="hover:bg-gray-50">
                                                <td className="p-4 font-bold text-gray-800">{c.name}</td>
                                                <td className="p-4 text-gray-600">{c.mobile && <div className="text-xs">Ph: {c.mobile}</div>}{c.gstin && <div className="text-xs text-blue-600 font-medium">GST: {c.gstin}</div>}</td>
                                                <td className="p-4 font-medium text-right"><span className={out > 0 ? 'text-red-600 bg-red-50 px-3 py-1 rounded-full font-bold' : out < 0 ? 'text-green-600 bg-green-50 px-3 py-1 rounded-full font-bold' : 'text-gray-500'}>₹{Math.abs(out).toFixed(2)} {out > 0 ? '(Due)' : out < 0 ? '(Adv)' : ''}</span></td>
                                                <td className="p-4 text-right space-x-2 whitespace-nowrap">
                                                    <Button variant="secondary" className="text-xs py-1.5 mr-1" onClick={() => setSelectedParty(c)}>Ledger</Button>
                                                    <button onClick={() => handleEdit(c)} className="p-1.5 text-orange-600 hover:bg-orange-50 rounded" title="Edit Party"><i className="fas fa-edit"></i></button>
                                                    <button onClick={() => handleDelete(c.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded" title="Delete Party"><i className="fas fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {filteredCustomers.length === 0 && (
                                        <tr><td colSpan="4" className="p-8 text-center text-gray-500">
                                            {partySearch.trim() ? 'No matching party or customer found' : 'No parties or customers added yet.'}
                                        </td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        }

        function PartyProfile({ party, onBack, invoices, payments, setPayments, settings, notify, onViewInvoice }) {
            const [activeTab, setActiveTab] = useState('ledger');
            const [isDownloading, setIsDownloading] = useState(false);
            const [payForm, setPayForm] = useState({ date: new Date().toISOString().split('T')[0], amount: '', type: 'IN', mode: 'Bank Transfer', remarks: '' });
            
            const partyInvoices = useMemo(() => (invoices || []).filter(inv => inv.customerName === party.name && inv.status !== 'Cancelled'), [invoices, party]);

            const ledgerEntries = useMemo(() => {
                const entries = [];
                partyInvoices.forEach(inv => {
                    entries.push({ id: inv.id, isInvoice: true, invoice: inv, date: inv.invoiceDate, particulars: `Sales ${inv.invoiceType || 'Invoice'} #`, invoiceNumber: inv.invoiceNumber, debit: inv.grandTotal, credit: 0, timestamp: inv.createdAt || new Date(inv.invoiceDate).getTime() });
                    if (inv.amountReceived > 0) entries.push({ id: `${inv.id}-pay`, date: inv.invoiceDate, particulars: `Advance on Invoice #${inv.invoiceNumber} (${inv.paymentMode})`, debit: 0, credit: Number(inv.amountReceived), timestamp: (inv.createdAt || new Date(inv.invoiceDate).getTime()) + 1 });
                });
                (payments || []).filter(p => p.partyId === party.id).forEach(pay => {
                    entries.push({ id: pay.id, date: pay.date, particulars: `Payment ${pay.type === 'IN' ? 'Received' : 'Paid'} (${pay.mode}) ${pay.remarks ? '- '+pay.remarks : ''}`, debit: pay.type === 'OUT' ? Number(pay.amount) : 0, credit: pay.type === 'IN' ? Number(pay.amount) : 0, timestamp: pay.timestamp || new Date(pay.date).getTime() });
                });
                entries.sort((a,b) => { const dateA = new Date(a.date).getTime(); const dateB = new Date(b.date).getTime(); if (dateA === dateB) return a.timestamp - b.timestamp; return dateA - dateB; });
                let balance = 0; entries.forEach(e => { balance += e.debit; balance -= e.credit; e.balance = balance; });
                return entries;
            }, [partyInvoices, payments, party]);

            const totalOutstanding = ledgerEntries.length > 0 ? ledgerEntries[ledgerEntries.length - 1].balance : 0;

            const handleSavePayment = (e) => {
                e.preventDefault(); if(!payForm.amount || Number(payForm.amount) <= 0) return;
                setPayments([...payments, { ...payForm, id: 'pay_'+Date.now(), amount: Number(payForm.amount), partyId: party.id, partyName: party.name, timestamp: Date.now() }]);
                setPayForm({ ...payForm, amount: '', remarks: '' }); 
                setActiveTab('ledger');
                notify("Payment recorded successfully.");
            };

            const handleDownloadBulk = () => {
                setIsDownloading(true);
                notify("Generating statement PDF, please wait...");
                const element = document.getElementById('ledger-print-area');
                element.classList.remove('hidden');
                
                const opt = { 
                    margin: 0.5, 
                    filename: `${party.name}_Ledger.pdf`, 
                    image: { type: 'jpeg', quality: 0.98 }, 
                    html2canvas: { scale: 2, useCORS: true }, 
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } 
                };
                if(window.html2pdf) {
                    window.html2pdf().set(opt).from(element).save().then(() => { 
                        setIsDownloading(false); 
                        element.classList.add('hidden'); 
                    });
                } else {
                    notify("PDF Library not loaded.");
                    setIsDownloading(false); 
                    element.classList.add('hidden'); 
                }
            };

            return (
                <div className="space-y-4 max-w-5xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <div className="mb-4 md:mb-0">
                            <h2 className="text-xl font-bold flex items-center text-gray-900"><button onClick={onBack} className="mr-3 text-gray-500 hover:text-blue-600 bg-gray-100 p-1.5 rounded-full"><i className="fas fa-chevron-left w-5 h-5 flex items-center justify-center"></i></button>{party.name}</h2>
                            <div className="mt-2 text-sm text-gray-600 ml-11 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-1"><p><span className="font-medium text-gray-500">Ph:</span> {party.mobile || 'N/A'}</p><p><span className="font-medium text-gray-500">GSTIN:</span> {party.gstin || 'N/A'}</p><p className="md:col-span-2"><span className="font-medium text-gray-500">Address:</span> {party.billingAddress || 'N/A'}</p></div>
                        </div>
                        <div className={`text-right p-4 rounded-lg border-2 ${totalOutstanding > 0 ? 'bg-red-50 border-red-100' : totalOutstanding < 0 ? 'bg-green-50 border-green-100' : 'bg-gray-50 border-gray-100'}`}>
                            <p className={`text-xs font-bold uppercase tracking-wider ${totalOutstanding > 0 ? 'text-red-600' : 'text-green-600'}`}>Total Outstanding Balance</p>
                            <p className={`text-3xl font-black mt-1 ${totalOutstanding > 0 ? 'text-red-700' : 'text-green-700'}`}>₹{Math.abs(totalOutstanding).toFixed(2)}</p>
                            <Button iconClass="fas fa-download" onClick={handleDownloadBulk} disabled={isDownloading || ledgerEntries.length===0} className="mt-3 w-full bg-slate-800 hover:bg-slate-900 text-white text-xs">{isDownloading ? 'Merging...' : 'Download Statement'}</Button>
                        </div>
                    </div>
                    <div className="flex space-x-6 border-b border-gray-300 px-2">
                        <button onClick={() => setActiveTab('ledger')} className={`pb-3 text-sm font-bold uppercase tracking-wide transition-colors ${activeTab === 'ledger' ? 'border-b-4 border-blue-600 text-blue-700' : 'text-gray-500 hover:text-gray-800'}`}>Ledger Statement</button>
                        <button onClick={() => setActiveTab('payment')} className={`pb-3 text-sm font-bold uppercase tracking-wide transition-colors ${activeTab === 'payment' ? 'border-b-4 border-green-600 text-green-700' : 'text-gray-500 hover:text-gray-800'}`}>+ Record Payment</button>
                    </div>
                    <div className="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                        {activeTab === 'ledger' && (
                            <div className="overflow-x-auto border rounded-lg">
                                <table className="w-full text-sm text-left" id="ledger-print-area">
                                    <thead className="bg-slate-800 text-white"><tr><th className="p-3">Date</th><th className="p-3 w-1/2">Particulars</th><th className="p-3 text-right text-red-300">Debit (Dr)</th><th className="p-3 text-right text-green-300">Credit (Cr)</th><th className="p-3 text-right font-bold">Balance</th></tr></thead>
                                    <tbody className="divide-y divide-gray-200 text-gray-800">
                                        <tr className="hidden print:table-row bg-gray-50"><td colSpan="5" className="p-4 text-center font-bold text-lg text-gray-800 uppercase tracking-widest border-b border-gray-300">Account Statement: {party.name}</td></tr>
                                        {[...ledgerEntries].reverse().map((entry, idx) => (
                                            <tr key={idx} className="hover:bg-gray-50">
                                                <td className="p-3 text-gray-600">{formatInvoiceDate(entry.date)}</td>
                                                <td className="p-3 font-medium text-gray-800">
                                                    {entry.isInvoice ? (
                                                        <span>
                                                            {entry.particulars}
                                                            <button 
                                                                type="button"
                                                                onClick={() => {
                                                                    // Resolve the invoice by its saved unique ID, not by a possibly duplicated display number.
                                                                    const savedInvoice = invoices.find(inv => inv.id === entry.id);
                                                                    if (!savedInvoice) {
                                                                        notify('Invoice record not found. It may have been deleted.');
                                                                        return;
                                                                    }
                                                                    openInvoicePdfInNewTab(savedInvoice, settings, notify);
                                                                }}
                                                                className="text-blue-600 font-bold ml-1 hover:underline focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
                                                                title="Open this invoice PDF in a new tab"
                                                                aria-label={`Open PDF for invoice ${entry.invoiceNumber} in a new tab`}
                                                            >
                                                                {entry.invoiceNumber}
                                                            </button>
                                                        </span>
                                                    ) : (
                                                        entry.particulars
                                                    )}
                                                </td>
                                                <td className="p-3 text-right text-red-600 font-medium">{entry.debit > 0 ? `₹${entry.debit.toFixed(2)}` : '-'}</td>
                                                <td className="p-3 text-right text-green-600 font-medium">{entry.credit > 0 ? `₹${entry.credit.toFixed(2)}` : '-'}</td>
                                                <td className="p-3 text-right font-bold text-[#1e293b] bg-gray-50">{Math.abs(entry.balance).toFixed(2)} <span className="text-[10px]">{entry.balance > 0 ? 'Dr' : entry.balance < 0 ? 'Cr' : ''}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        {activeTab === 'payment' && (
                            <form onSubmit={handleSavePayment} className="space-y-4 max-w-2xl"><div className="grid grid-cols-1 md:grid-cols-2 gap-4"><Input label="Date" type="date" value={payForm.date} onChange={e => setPayForm({...payForm, date: e.target.value})} required /><Input label="Amount (₹)" type="number" step="0.01" value={payForm.amount} onChange={e => setPayForm({...payForm, amount: e.target.value})} required /><Select label="Payment Type" value={payForm.type} options={[{label: 'Received (IN)', value: 'IN'}, {label: 'Paid/Refunded (OUT)', value: 'OUT'}]} onChange={e => setPayForm({...payForm, type: e.target.value})} required /><Select label="Payment Mode" value={payForm.mode} options={['Cash', 'Bank Transfer', 'UPI', 'Cheque', 'Adjustments']} onChange={e => setPayForm({...payForm, mode: e.target.value})} required /></div><Input label="Remarks" value={payForm.remarks} onChange={e => setPayForm({...payForm, remarks: e.target.value})} /><div className="pt-4 flex justify-end"><Button type="submit" variant="success" className="px-8 shadow-md">Save Payment</Button></div></form>
                        )}
                    </div>
                </div>
            );
        }

                    </div>
                    {showForm && (

                    <Card>

        function ReportsView({ invoices }) {
            const [month, setMonth] = useState(new Date().getMonth());
            const [year, setYear] = useState(new Date().getFullYear());

            const filteredInvoices = useMemo(() => invoices.filter(inv => {
                if (inv.status === 'Cancelled') return false;
                const d = new Date(inv.invoiceDate); return d.getMonth() === parseInt(month) && d.getFullYear() === parseInt(year);
            }), [invoices, month, year]);

            const stats = useMemo(() => {
                let totalSales = 0, totalTaxable = 0, totalCGST = 0, totalSGST = 0, totalIGST = 0, totalGST = 0;
                filteredInvoices.forEach(inv => { totalSales += (inv.grandTotal || 0); totalTaxable += (inv.totalTaxable || 0); totalCGST += (inv.totalCGST || 0); totalSGST += (inv.totalSGST || 0); totalIGST += (inv.totalIGST || 0); totalGST += (inv.totalGST || 0); });
                return { totalSales, totalTaxable, totalCGST, totalSGST, totalIGST, totalGST, count: filteredInvoices.length };
            }, [filteredInvoices]);

            const handleExportCSV = () => {
                const headers = ['Invoice No', 'Date', 'Type', 'Customer', 'GSTIN', 'Taxable Value', 'CGST', 'SGST', 'IGST', 'Total GST', 'Grand Total'];
                const rows = filteredInvoices.map(inv => [inv.invoiceNumber, inv.invoiceDate, inv.invoiceType || 'Tax Invoice', `"${inv.customerName}"`, inv.customerGstin || '', inv.totalTaxable.toFixed(2), (inv.totalCGST || 0).toFixed(2), (inv.totalSGST || 0).toFixed(2), (inv.totalIGST || 0).toFixed(2), (inv.totalGST || 0).toFixed(2), inv.grandTotal.toFixed(2)]);
                const csvContent = "data:text/csv;charset=utf-8," + headers.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
                const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `GST_Report_${month + 1}_${year}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            return (
                <div className="space-y-6 max-w-5xl mx-auto">
                    <div><h2 className="text-2xl font-bold text-gray-800">Monthly Reports & Summary</h2><p className="text-sm text-gray-500">View and export your monthly GST billing summary.</p></div>
                    <Card className="p-4 flex flex-col sm:flex-row gap-4 items-end bg-white">
                        <Select label="Select Month" value={month} onChange={e => setMonth(e.target.value)} options={["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"].map((m, i) => ({label: m, value: i}))} className="w-full sm:w-48" />
                        <Select label="Select Year" value={year} onChange={e => setYear(e.target.value)} options={Array.from({length: 5}, (_, i) => new Date().getFullYear() - i).map(y => ({label: y, value: y}))} className="w-full sm:w-48" />
                        <Button iconClass="fas fa-file-csv" onClick={handleExportCSV} className="w-full sm:w-auto bg-green-600 hover:bg-green-700">Export CSV</Button>
                    </Card>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"><StatCard title="Total Invoices" value={stats.count} color="blue" /><StatCard title="Total Sales" value={`₹${stats.totalSales.toFixed(2)}`} color="green" /><StatCard title="Taxable Value" value={`₹${stats.totalTaxable.toFixed(2)}`} color="purple" /><StatCard title="Total GST" value={`₹${stats.totalGST.toFixed(2)}`} color="orange" /></div>
                    <Card className="p-6">
                        <h3 className="text-lg font-semibold mb-4 border-b pb-2">Tax Breakdown</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6 text-center">
                            <div className="p-4 bg-blue-50 rounded-lg border border-blue-100"><p className="text-sm text-blue-600 mb-1 font-medium">Total CGST</p><p className="text-2xl font-bold text-blue-900">₹{stats.totalCGST.toFixed(2)}</p></div>
                            <div className="p-4 bg-green-50 rounded-lg border border-green-100"><p className="text-sm text-green-600 mb-1 font-medium">Total SGST</p><p className="text-2xl font-bold text-green-900">₹{stats.totalSGST.toFixed(2)}</p></div>
                            <div className="p-4 bg-purple-50 rounded-lg border border-purple-100"><p className="text-sm text-purple-600 mb-1 font-medium">Total IGST</p><p className="text-2xl font-bold text-purple-900">₹{stats.totalIGST.toFixed(2)}</p></div>
                        </div>
                    </Card>
                </div>
            );
        }

        function SettingsManager({ settings, setSettings, setInvoices, setCustomers, setProducts, setPayments, notify, prefix }) {
            const [formData, setFormData] = useState(settings || {});
            const [activeSection, setActiveSection] = useState(null);
            useEffect(() => { setFormData(settings || {}); }, [settings]);

            const handleSave = (e) => {
                e.preventDefault();
                if (activeSection === 'invoice') {
                    if (!String(formData.prefix || '').trim() || !String(formData.challanPrefix ?? 'AGF-CH').trim() ||
                        !positiveSeq(formData.nextSeq) || !positiveSeq(formData.challanNextSeq ?? 1)) {
                        notify('Enter valid prefixes and positive integer next sequence numbers.');
                        return;
                    }
                }
                setSettings(formData);
                notify("Settings saved successfully!"); 
                setActiveSection(null);
            };

            const handleDataExport = () => {
                const data = {
                    settings: JSON.parse(localStorage.getItem(`${prefix}_settings`)),
                    invoices: JSON.parse(localStorage.getItem(`${prefix}_invoices`)),
                    customers: JSON.parse(localStorage.getItem(`${prefix}_customers`)),
                    products: JSON.parse(localStorage.getItem(`${prefix}_products`)),
                    payments: JSON.parse(localStorage.getItem(`${prefix}_payments`)),
                };
                const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `GST_Backup_${prefix}_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                notify("Backup exported successfully.");
            };

            const handleDataImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.settings) {
                            localStorage.setItem(`${prefix}_settings`, JSON.stringify(parsed.settings));
                            setSettings(parsed.settings);
                            setFormData(parsed.settings);
                        }
                        if (parsed.invoices) {
                            localStorage.setItem(`${prefix}_invoices`, JSON.stringify(parsed.invoices));
                            setInvoices(parsed.invoices);
                        }
                        if (parsed.customers) {
                            localStorage.setItem(`${prefix}_customers`, JSON.stringify(parsed.customers));
                            setCustomers(parsed.customers);
                        }
                        if (parsed.products) {
                            localStorage.setItem(`${prefix}_products`, JSON.stringify(parsed.products));
                            setProducts(parsed.products);
                        }
                        if (parsed.payments) {
                            localStorage.setItem(`${prefix}_payments`, JSON.stringify(parsed.payments));
                            setPayments(parsed.payments);
                        }
                        notify("Backup imported and restored successfully!");
                    } catch (err) {
                        notify("Invalid backup file format!");
                    }
                };
                reader.readAsText(file);
            };

            const handleDriveAction = (action) => {
                if (!formData.gdriveClientId) {
                    notify("Please enter a Google Client ID in the input box below first.");
                    return;
                }
                
                try {
                    const client = google.accounts.oauth2.initTokenClient({
                        client_id: formData.gdriveClientId,
                        scope: 'https://www.googleapis.com/auth/drive.file',
                        callback: (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                if (action === 'backup') performDriveBackup(tokenResponse.access_token);
                                if (action === 'restore') performDriveRestore(tokenResponse.access_token);
                            }
                        },
                    });
                    client.requestAccessToken();
                } catch (e) {
                    notify("Google Auth Library not fully loaded. Check internet connection.");
                }
            };

            const performDriveBackup = (accessToken) => {
                notify("Uploading backup to Google Drive...");
                const data = {
                    settings: JSON.parse(localStorage.getItem(`${prefix}_settings`)),
                    invoices: JSON.parse(localStorage.getItem(`${prefix}_invoices`)),
                    customers: JSON.parse(localStorage.getItem(`${prefix}_customers`)),
                    products: JSON.parse(localStorage.getItem(`${prefix}_products`)),
                    payments: JSON.parse(localStorage.getItem(`${prefix}_payments`)),
                };
                
                const fileContent = JSON.stringify(data);
                const file = new Blob([fileContent], {type: 'application/json'});
                const metadata = {
                    'name': `DG_BILLING_BACKUP_${prefix}_${new Date().toISOString().split('T')[0]}.json`,
                    'mimeType': 'application/json'
                };
                
                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], {type: 'application/json'}));
                form.append('file', file);

                fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form,
                })
                .then(res => res.json())
                .then(val => {
                    if (val.id) notify("Database saved to Google Drive successfully!");
                    else notify("Failed to upload backup.");
                })
                .catch(() => notify("Error during Drive upload."));
            };

            const performDriveRestore = (accessToken) => {
                notify("Searching for latest backup in Google Drive...");
                const query = encodeURIComponent(`name contains "DG_BILLING_BACKUP_${prefix}" and mimeType="application/json"`);
                
                fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&orderBy=createdTime desc`, {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                })
                .then(searchRes => searchRes.json())
                .then(searchData => {
                    if (searchData.files && searchData.files.length > 0) {
                        const latestFile = searchData.files[0];
                        notify(`Found backup: ${latestFile.name}. Restoring...`);
                        
                        fetch(`https://www.googleapis.com/drive/v3/files/${latestFile.id}?alt=media`, {
                            headers: { 'Authorization': 'Bearer ' + accessToken }
                        })
                        .then(fileRes => fileRes.json())
                        .then(parsed => {
                            if (parsed.settings) {
                                localStorage.setItem(`${prefix}_settings`, JSON.stringify(parsed.settings));
                                setSettings(parsed.settings);
                                setFormData(parsed.settings);
                            }
                            if (parsed.invoices) { localStorage.setItem(`${prefix}_invoices`, JSON.stringify(parsed.invoices)); setInvoices(parsed.invoices); }
                            if (parsed.customers) { localStorage.setItem(`${prefix}_customers`, JSON.stringify(parsed.customers)); setCustomers(parsed.customers); }
                            if (parsed.products) { localStorage.setItem(`${prefix}_products`, JSON.stringify(parsed.products)); setProducts(parsed.products); }
                            if (parsed.payments) { localStorage.setItem(`${prefix}_payments`, JSON.stringify(parsed.payments)); setPayments(parsed.payments); }
                            
                            notify("Data restored successfully from Google Drive!");
                        })
                        .catch(() => notify("Error reading data from drive file."));
                    } else {
                        notify("No backup files found on this Google Drive for this company.");
                    }
                })
                .catch(() => notify("Error during Drive restore search."));
            };

            const handleFileChange = (e, field) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 500 * 1024) { notify("File is too large! Please upload an image smaller than 500KB."); return; }
                    const reader = new FileReader();
                    reader.onloadend = () => setFormData(prev => ({ ...prev, [field]: reader.result }));
                    reader.readAsDataURL(file);
                }
            };

            const SettingMenuBtn = ({ icon, title, onClick }) => (
                <div onClick={onClick} className="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm cursor-pointer hover:bg-blue-50 transition-colors mb-3">
                    <div className="flex items-center space-x-4">
                        <div className="bg-blue-100 p-2 rounded-lg text-blue-600 w-10 text-center"><i className={icon}></i></div>
                        <span className="font-semibold text-gray-800">{title}</span>
                    </div>
                    <i className="fas fa-chevron-right text-gray-400"></i>
                </div>
            );

            const ImageUpload = ({ label, field, value }) => (
                <div className="flex flex-col space-y-2 bg-gray-50 p-4 border rounded-lg border-dashed border-gray-300">
                    <label className="text-sm font-medium text-gray-700">{label} <span className="text-[10px] text-gray-400 font-normal">(Max 500KB)</span></label>
                    <div className="flex items-center space-x-4">
                        {value ? (
                            <div className="relative">
                                <img src={value} alt={label} className="w-16 h-16 object-contain border border-gray-200 rounded bg-white shadow-sm" />
                                <button type="button" onClick={() => setFormData(prev => ({...prev, [field]: null}))} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-red-600"><i className="fas fa-times"></i></button>
                            </div>
                        ) : (
                            <input type="file" accept="image/*" onChange={(e) => handleFileChange(e, field)} className="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        )}
                    </div>
                </div>
            );

            if (!activeSection) {
                return (
                    <div className="max-w-3xl mx-auto mt-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div><h2 className="text-2xl font-bold text-gray-800">Settings</h2><p className="text-sm text-gray-500">Configure business, billing, and app preferences.</p></div>
                            <div className="flex space-x-2">
                                <Button iconClass="fas fa-hdd" onClick={handleDataExport} variant="secondary">Export Backup</Button>
                                <label className="inline-flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-300 cursor-pointer transition-colors">
                                    <i className="fas fa-upload mr-2"></i> Import Backup
                                    <input type="file" accept=".json" onChange={handleDataImport} className="hidden" />
                                </label>
                            </div>
                        </div>

                        <SettingMenuBtn icon="fas fa-image" title="Branding & Images" onClick={() => setActiveSection('branding')} />
                        <SettingMenuBtn icon="fas fa-building" title="Business Details" onClick={() => setActiveSection('business')} />
                        <SettingMenuBtn icon="fas fa-university" title="Bank Details" onClick={() => setActiveSection('bank')} />
                        <SettingMenuBtn icon="fas fa-file-invoice" title="Invoice Settings" onClick={() => setActiveSection('invoice')} />
                        <SettingMenuBtn icon="fab fa-google-drive" title="Google Drive Backup" onClick={() => setActiveSection('gdrive')} />
                        <SettingMenuBtn icon="fas fa-shield-alt" title="Security & PIN Modification" onClick={() => setActiveSection('security')} />
                        <SettingMenuBtn icon="fas fa-info-circle" title="About & Updates" onClick={() => setActiveSection('about')} />
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto space-y-4">
                    <div className="flex items-center mb-6">
                        <button type="button" onClick={() => setActiveSection(null)} className="mr-4 w-10 h-10 flex justify-center items-center bg-gray-200 rounded-full hover:bg-gray-300 transition text-gray-600"><i className="fas fa-arrow-left"></i></button>
                        <h2 className="text-xl font-bold capitalize text-gray-800">{activeSection.replace('-', ' ')} Settings</h2>
                    </div>
                    
                    <form onSubmit={handleSave} className="space-y-6">
                        {activeSection === 'branding' && (
                            <Card className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <ImageUpload field="logo" label="Business Logo" value={formData.logo}/>
                                    <ImageUpload field="signature" label="Authorized Signature" value={formData.signature}/>
                                    <ImageUpload field="qrCode" label="UPI / Bank QR Code" value={formData.qrCode}/>
                                </div>
                            </Card>
                        )}

                        {activeSection === 'business' && (
                            <Card className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <Input label="Business / Firm Name" onChange={(e) => setFormData({...formData, firmName: e.target.value})} value={formData.firmName} required />
                                    <Input label="GSTIN" onChange={(e) => setFormData({...formData, gstin: e.target.value})} value={formData.gstin} required />
                                    <div className="md:col-span-2"><Input label="Business Address" onChange={(e) => setFormData({...formData, address: e.target.value})} value={formData.address} required /></div>
                                    <Input label="State" onChange={(e) => setFormData({...formData, state: e.target.value})} value={formData.state} required />
                                    <Select label="State Code" onChange={(e) => setFormData({...formData, stateCode: e.target.value})} options={STATES} value={formData.stateCode} required />
                                    <Input label="Mobile Number" onChange={(e) => setFormData({...formData, mobile: e.target.value})} value={formData.mobile} />
                                    <Input label="Email" onChange={(e) => setFormData({...formData, email: e.target.value})} type="email" value={formData.email} />
                                </div>
                            </Card>
                        )}

                        {activeSection === 'bank' && (
                            <Card className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <Input label="Bank Name" onChange={(e) => setFormData({...formData, bankName: e.target.value})} value={formData.bankName} />
                                    <Input label="Account Number" onChange={(e) => setFormData({...formData, accountNo: e.target.value})} value={formData.accountNo} />
                                    <Input label="IFSC Code" onChange={(e) => setFormData({...formData, ifsc: e.target.value})} value={formData.ifsc} />
                                    <Input label="UPI ID" onChange={(e) => setFormData({...formData, upi: e.target.value})} value={formData.upi} />
                                </div>
                            </Card>
                        )}

                        {activeSection === 'invoice' && (
                            <Card className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <Input label="Invoice Prefix" onChange={(e) => setFormData({...formData, prefix: e.target.value})} value={formData.prefix} required />
                                    <Input className="bg-gray-100" disabled label="Current Financial Year" value={getFinancialYear()}/>
                                    <Input label="Next Sequence No." min="1" onChange={(e) => setFormData({...formData, nextSeq: parseInt(e.target.value) || 1})} type="number" value={formData.nextSeq} required />
                                </div>
                                <p className="text-sm text-gray-500 mt-2">Example: {formData.prefix || 'INV'}-{getFinancialYear()}-{String(formData.nextSeq || 1).padStart(4, '0')}</p>
                                <div className="border-t mt-6 pt-5">
                                    <h3 className="font-bold text-gray-800 text-lg mb-2">Challan Invoice Settings</h3>
                                    <p className="text-sm text-gray-500 mb-4">Independent Challan numbering (GST invoice numbers remain unchanged).</p>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <Input label="Challan Prefix" value={formData.challanPrefix ?? 'AGF-CH'} onChange={e => setFormData({...formData, challanPrefix: e.target.value})} required />
                                        <Input label="Current Financial Year" value={getFinancialYear()} disabled className="bg-gray-100" />
                                        <Input label="Next Challan Sequence No." type="number" min="1" step="1" value={formData.challanNextSeq ?? 1} onChange={e => setFormData({...formData, challanNextSeq: e.target.value})} required />
                                    </div>
                                    <p className="text-sm text-gray-500 mt-2">Challan Number Preview: <strong>{challanNumber(formData.challanPrefix || 'AGF-CH', getFinancialYear(), formData.challanNextSeq || 1)}</strong></p>
                                    <div className="mt-4"><Button type="submit" iconClass="fas fa-save">Save Challan Settings</Button></div>
                                </div>
                            </Card>
                        )}

                        {activeSection === 'gdrive' && (
                            <Card className="p-6">
                                <h3 className="text-lg font-bold border-b pb-2 mb-4">Google Drive Cloud Sync</h3>
                                <p className="text-sm text-gray-600 mb-6">Connect your Google Drive to enable 1-click cloud backups. This requires a free Google Cloud Client ID for authentication.</p>
                                
                                <div className="grid grid-cols-1 gap-4 mb-8 bg-blue-50 p-4 rounded border border-blue-100">
                                    <Input label="Google Client ID" onChange={(e) => setFormData({...formData, gdriveClientId: e.target.value})} value={formData.gdriveClientId || ''} placeholder="Enter your Google Client ID here..." />
                                    <div className="text-xs text-gray-600 font-medium">
                                        <p className="font-bold text-gray-800 mb-1">How to setup:</p>
                                        <ul className="list-disc pl-4 space-y-1">
                                            <li>Go to the <a href="https://console.cloud.google.com/" target="_blank" className="text-blue-600 hover:underline">Google Cloud Console</a>.</li>
                                            <li>Create a New Project, go to APIs &amp; Services &gt; Credentials.</li>
                                            <li>Create an <strong>OAuth client ID</strong> (Web Application).</li>
                                            <li>Add this app's domain (or http://localhost) to <strong>Authorized JavaScript origins</strong>.</li>
                                            <li>Copy the Client ID and paste it in the box above.</li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="flex flex-col md:flex-row space-y-3 md:space-y-0 md:space-x-4 border-t border-gray-200 pt-6">
                                    <Button type="button" onClick={() => handleDriveAction('backup')} variant="primary" iconClass="fas fa-cloud-upload-alt">1-Click Backup to Drive</Button>
                                    <Button type="button" onClick={() => handleDriveAction('restore')} variant="success" iconClass="fas fa-cloud-download-alt">Restore from Drive</Button>
                                </div>
                            </Card>
                        )}

                        {activeSection === 'security' && (
                            <Card className="p-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <Input label="Deletion PIN" onChange={(e) => setFormData({...formData, deletePin: e.target.value})} type="password" value={formData.deletePin || ''} placeholder="Set a 4-6 digit PIN" />
                                    <p className="text-sm text-gray-500 flex items-center md:col-span-2 mt-2"><i className="fas fa-shield-alt text-red-500 mr-2"></i> This PIN will be required to permanently delete cancelled bills. Leave blank to disable.</p>
                                </div>
                            </Card>
                        )}

                        {activeSection === 'about' && (
                            <Card className="p-6">
                                <h3 className="text-lg font-bold border-b pb-2 mb-4">Version History & Updates</h3>
                                <ul className="space-y-4 text-sm text-gray-700">
                                    <li className="rounded-lg border border-blue-200 bg-blue-50 p-4">
                                        <span className="font-bold text-blue-700">v2.0.1 (Current)</span> - Oct 15, 2026
                                        <p className="font-semibold mt-2 mb-2 text-gray-800">Invoice Navigation &amp; Party Ledger Improvements</p>
                                        <ul className="list-disc pl-5 space-y-1.5">
                                            <li><span className="font-semibold">Invoices:</span> Invoice numbers are clickable and open the selected invoice's full details.</li>
                                            <li><span className="font-semibold">Parties &amp; Customers:</span> Added instant customer/party name search, including partial matches and a clear-search button.</li>
                                            <li><span className="font-semibold">Party Ledger:</span> Clicking a Sales Invoice number opens its PDF in a new browser tab, using the saved invoice and existing PDF layout without leaving the ledger.</li>
                                        </ul>
                                    </li>
                                    <li><span className="font-bold">v2.0.0</span> - Oct 12, 2026<br/>Added independent Challan Invoice Settings and separate GST Invoice / Challan numbering sequences. Added Job Work Challan and Delivery Challan options, Challan Prefix, Financial Year, Next Sequence Number, Challan Number Preview, searchable Challan history, decimal Qty/Weight support, unit selection, and improved quantity-based calculations and Challan management.</li>
                                    <li><span className="font-bold">v1.9.9</span> - Oct 11, 2026<br/>Fixed local file parser errors, optimized asynchronous fetching logic, and resolved strict mode syntax bugs to eliminate white-screen loading failures.</li>
                                    <li><span className="font-bold">v1.9.8</span> - Oct 11, 2026<br/>Added dropdown filter in Invoices to separate Tax Invoices and Challan Bills. Integrated Google Drive API for 1-click cloud Backup and Restore.</li>
                                    <li><span className="font-bold">v1.9.7</span> - Oct 10, 2026<br/>Added Challan Bill option with no tax calculation, and highlighted E-way No.</li>
                                    <li><span className="font-bold">v1.9.6</span> - Oct 7, 2026<br/>Fixed 3-page blank PDF bug and added direct PDF document sharing to WhatsApp via Web Share API.</li>
                                    <li><span className="font-bold">v1.9.5</span> - Oct 7, 2026<br/>Removed bulk PDF download from Parties tab, added clickable invoice numbers in Party Ledger for direct viewing.</li>
                                    <li><span className="font-bold">v1.9.4</span> - Oct 5, 2026<br/>Removed corporate template option per user request, fixed bulk invoice downloading bug (blank PDF issue) with off-screen rendering container.</li>
                                    <li><span className="font-bold">v1.8.3</span> - Oct 4, 2026<br/>Removed email sharing option, fixed 3-page bug (blank page 2) for single downloads, and optimized 2-page print/PDF export.</li>
